name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    # every 6 hours (UTC); during registration you can run it by hand from the Actions tab
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.built.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape LAU Banner
        if: github.event_name != 'push'
        # if Banner is down, keep deploying the last good data
        continue-on-error: true
        run: npm run scrape

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh course offerings"
            git push
          fi

      - run: npm test

      - run: npm run build

      # the commit this site was built from (after any data commit above)
      - id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # "Re-run jobs" on an old run would republish that old build and roll the site back.
      # Only deploy if this build is still the latest commit on main.
      - name: Refuse to deploy an outdated build
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$head" != "${{ needs.build.outputs.sha }}" ]; then
            echo "::error::This run built ${{ needs.build.outputs.sha }}, but main is now at $head. Deploying it would roll the site back. To refresh, use Actions > Refresh data & deploy > Run workflow instead of re-running an old run."
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
